<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cambiar de usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="usuario__color">
    <div class="link__position">
        <button id="dark-toggle" class="dark__btn">Modo Oscuro</button>
        <a class="links__th" href="index.html">Homepage</a>
    </div>
    <h1 class="usuario__title">Login con tu Usuario</h1>
    <form id="form-usuario" class="form__usuario">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" required>
        <label for="gmail">Gmail</label>
        <input type="email" id="gmail" name="gmail" pattern="^[^@\s]+@gmail\.com$" title="Introduce un correo de Gmail valido" required>
        <button type="submit">Guardar</button>
    </form>
     <div class="links__login">
        <a href="registro.html">You don't have an account? Sign up!</a>
    </div>
    <script src="usuario.js"></script>
     <script src="darkmode.js"></script>
</body>

</html>
