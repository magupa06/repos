<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cambiar de usuario</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="usuario__color">
    <h1 class="title__homepage">Cambiar de usuario</h1>
    <form id="form-usuario" class="form__usuario">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>

        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" required>

        <label for="gmail">Gmail</label>
        <input type="email" id="gmail" name="gmail" pattern="^[^@\s]+@gmail\.com$" title="Introduce un correo de Gmail valido" required>

        <button type="submit">Guardar</button>
    </form>
    <script src="usuario.js"></script>
</body>

</html>
