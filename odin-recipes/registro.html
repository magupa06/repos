<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="usuario__color">
    <div class="links__position">
        <a class="links__th" href="index.html">Homepage</a>
        <button id="dark-toggle" class="dark__btn">Modo Oscuro</button>
    </div>
    <h1 class="usuario__title">Crea tu Cuenta</h1>
    <form id="form-registro" class="form__usuario">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required>
        <label for="apellido">Apellido</label>
        <input type="text" id="apellido" name="apellido" required>
        <label for="gmail">Gmail</label>
        <input type="email" id="gmail" name="gmail" pattern="^[^@\s]+@gmail\.com$" title="Introduce un correo de Gmail valido" required>
        <label for="edad">Edad</label>
        <input type="number" id="edad" name="edad" min="0" max="120" required>
        <label for="ciudad">Ciudad de residencia</label>
        <input type="text" id="ciudad" name="ciudad" required>
        <button type="submit">Crear cuenta</button>
    </form>
    <script src="registro.js"></script>
     <script src="darkmode.js"></script>
</body>

</html>
